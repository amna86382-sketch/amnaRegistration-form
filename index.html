
 <!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <h1>Intern Registration Form</h1>
  <p>Please fill out the form below.</p>
  <form action="#" method="post">
           <!-- Name -->
  <label for="name">Full Name:</label>
   <input type="text" id="name" name="name"
    placeholder="Enter your full name" required>
   <br><br>
         <!-- Email -->
  <label for="email">Email:</label>
  <input type="email" id="email" name="email"
  placeholder="Enter your email" required>
   <br><br>
         <!-- Phone -->
   <label for="phone">Phone Number:</label>
   <input type="tel" id="phone" name="phone"
  placeholder="03XXXXXXXXX" required>
   <br><br>
         <!-- Date of Birth -->
   <label for="dob">Date of Birth:</label>
   <input type="date" id="dob" name="dob" required>
    <br><br>
        <!-- Gender -->
    <p>Gender:</p>
    <input type="radio" id="male" name="gender" value="Male" required>
     <label for="male">Male</label>
     <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>
     <input type="radio" id="other" name="gender" value="Other">
     <label for="other">Other</label>
   <br><br>
          <!-- Course -->
    <label for="course">Select Course:</label>
    <select id="course" name="course" required>
    <option value="">Choose a course</option> 
    <option value="Web Development">Web Development</option>
    <option value="Graphic Design">Graphic Design</option>
    <option value="Digital Marketing">Digital Marketing</option>
    <option value="App Development">App Development</option>
    <option value="Other">Other</option>
    </select>
    <br><br>
           <!-- Skills -->
    <p>Select Your Skills:</p>
    <input type="checkbox" id="html" name="skills" value="HTML">
    <label for="html">HTML</label>
    <input type="checkbox" id="css" name="skills" value="CSS">
    <label for="css">CSS</label>
    <input type="checkbox" id="javascript" name="skills" value="JavaScript">
    <label for="javascript">JavaScript</label>
    <input type="checkbox" id="design" name="skills" value="Graphic Design">
    <label for="design">Graphic Design</label>
    <br><br>
              <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" placeholder="Enter your address" rows="4" cols="40" required></textarea>
        <br><br>
        <!-- Message -->
        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message" placeholder="Enter your message" rows="5" cols="40"></textarea>
        <br><br>
           <!-- Buttons -->
   <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    </form>
  </body>
   </html>
